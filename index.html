<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机械结构虚拟试验台 - 自由装配</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Micro Hei",system-ui,sans-serif;font-size:13px;color:#1f2937;background:#e5e7eb;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#111827;color:#e5e7eb;flex-wrap:wrap;min-height:46px}
#topbar h1{font-size:15px;margin:0 10px 0 0;font-weight:600;color:#fff;white-space:nowrap}
#topbar .sep{width:1px;height:24px;background:#374151;margin:0 2px}
button,select,input{font-family:inherit;font-size:13px}
.tb{background:#374151;color:#f3f4f6;border:1px solid #4b5563;border-radius:5px;padding:5px 8px;cursor:pointer;white-space:nowrap}
.tb:hover:not(:disabled){background:#4b5563}
.tb:disabled{opacity:.4;cursor:default}
.tb.run{background:#16a34a;border-color:#15803d;color:#fff;font-weight:600}
.tb.run:hover:not(:disabled){background:#15803d}
.tb.pause{background:#d97706;border-color:#b45309;color:#fff}
.tb.reset{background:#dc2626;border-color:#b91c1c;color:#fff}
.tb.on{background:#2563eb;border-color:#1d4ed8}
#topbar select{background:#374151;color:#f3f4f6;border:1px solid #4b5563;border-radius:5px;padding:5px 6px}
#topbar label{display:flex;align-items:center;gap:4px;color:#d1d5db;white-space:nowrap}
#modeBadge{padding:3px 10px;border-radius:12px;font-weight:600;font-size:12px;background:#2563eb;color:#fff;white-space:nowrap}
#modeBadge.run{background:#16a34a}#modeBadge.pause{background:#d97706}
#main{display:flex;flex:1;min-height:0}
#palette{width:176px;background:#f9fafb;border-right:1px solid #d1d5db;overflow-y:auto;padding:8px;flex:none}
#palette h3,#side h3{margin:8px 0 6px;font-size:12px;color:#6b7280;font-weight:600;letter-spacing:1px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.item{background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:4px 2px 3px;text-align:center;cursor:grab;user-select:none;touch-action:none;font-size:12px}
.item:hover{border-color:#2563eb;background:#eff6ff}
.item.armed{border-color:#2563eb;background:#dbeafe;box-shadow:0 0 0 2px #93c5fd}
.item canvas{display:block;margin:0 auto 2px}
.tools{display:flex;flex-direction:column;gap:5px}
.tool{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:5px 7px;cursor:pointer;text-align:left}
.tool:hover{border-color:#2563eb}
.tool.sel{background:#2563eb;color:#fff;border-color:#1d4ed8}
.tool canvas{flex:none}
.tool small{opacity:.7;margin-left:auto}
#center{flex:1;position:relative;min-width:0;background:#f8fafc}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#hint{position:absolute;left:10px;bottom:8px;background:rgba(17,24,39,.82);color:#fff;padding:5px 10px;border-radius:5px;pointer-events:none;max-width:70%}
#warn{position:absolute;right:10px;top:8px;background:#fee2e2;color:#991b1b;padding:4px 10px;border-radius:5px;display:none;border:1px solid #fca5a5}
#energy{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.9);border:1px solid #d1d5db;border-radius:6px;padding:5px 9px;font-size:12px;line-height:1.55;display:none;font-variant-numeric:tabular-nums}
#side{width:290px;background:#f9fafb;border-left:1px solid #d1d5db;overflow-y:auto;padding:8px 10px;flex:none}
#side .row{display:flex;align-items:center;gap:6px;margin:4px 0}
#side .row label{width:92px;color:#4b5563;flex:none}
#side .row input[type=number],#side .row select,#side .row input[type=text]{flex:1;min-width:0;padding:3px 5px;border:1px solid #cbd5e1;border-radius:4px;background:#fff}
#side .row .u{width:34px;color:#9ca3af;font-size:11px;flex:none}
#side button.del{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;border-radius:5px;padding:4px 10px;cursor:pointer;margin-top:6px}
#side .title{font-weight:700;font-size:14px;margin-bottom:4px}
#readout{background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:6px 8px;font-size:12px;line-height:1.6;font-variant-numeric:tabular-nums;margin-top:8px;display:none}
#readout b{color:#111827}
#side.run{display:flex;flex-direction:column}#side.run h3,#side.run #props{order:3}#side.run #readout{order:1;margin-top:0}#side.run #plot{order:2}
#plot{width:100%;height:150px;background:#fff;border:1px solid #d1d5db;border-radius:6px;margin-top:8px;display:none}
#status{background:#111827;color:#9ca3af;padding:3px 10px;font-size:12px;display:flex;gap:16px;flex:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#6b7280;margin-top:6px}
.key{display:inline-block;background:#e5e7eb;border-radius:3px;padding:0 4px;margin:0 1px}
#ghost{position:fixed;pointer-events:none;z-index:99;opacity:.85;display:none}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>机械结构虚拟试验台</h1>
    <span id="modeBadge">编辑模式</span>
    <button class="tb run" id="btnRun" title="运行 / 继续 (Space)">▶ 运行</button>
    <button class="tb pause" id="btnPause" title="暂停 (Space)" disabled>⏸ 暂停</button>
    <button class="tb reset" id="btnReset" title="重置：恢复到“初始状态”（编辑模式下初始状态自动跟随当前布局）" disabled>⟲ 重置</button>
    <button class="tb" id="btnSetInit" title="把当前姿态/布局设为初始状态，之后每次重置都回到这里">设为初始状态</button>
    <button class="tb" id="btnSetInitRun" title="暂停在某个姿态后，把它冻结为新的初始状态（速度清零）" disabled>将当前运行状态设为初始状态</button>
    <span class="sep"></span>
    <label><input type="checkbox" id="chkGravity" checked> 重力</label>
    <label>速度 <select id="selSpeed">
      <option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
    <span class="sep"></span>
    <button class="tb" id="btnUndo" title="撤销 (Ctrl+Z)">↶ 撤销</button>
    <button class="tb" id="btnRedo" title="重做 (Ctrl+Y)">↷ 重做</button>
    <span class="sep"></span>
    <label>示例 <select id="selPreset"><option value="">载入示例装配…</option></select></label>
    <button class="tb" id="btnClear">清空</button>
    <button class="tb" id="btnFit" title="适应视图">⛶ 适应</button>
    <span class="sep"></span>
    <button class="tb" id="btnSave" title="保存装配为 JSON 文件 (Ctrl+S)">保存</button>
    <button class="tb" id="btnLoad" title="读取装配 JSON 文件">读取</button>
    <button class="tb" id="btnBom" title="导出零件清单(BOM)和连接清单 CSV">导出BOM</button>
    <button class="tb" id="btnPng" title="导出画布为 PNG 图片">导出PNG</button>
    <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
  </div>
  <div id="main">
    <div id="palette">
      <h3>零件库（拖到画布）</h3>
      <div class="pal" id="palItems"></div>
      <h3>传动零件</h3>
      <div class="pal" id="palTrans"></div>
      <h3>连接工具</h3>
      <div class="tools" id="palTools"></div>
      <label style="display:block;margin-top:6px;font-size:12px;color:#4b5563"><input type="checkbox" id="chkAuto" checked> 自动检测啮合（节圆相切）</label>
      <div class="legend">
        <span><span class="key">Space</span>运行/暂停</span><span><span class="key">Del</span>删除</span><span><span class="key">Esc</span>取消</span>
        <span><span class="key">R</span>旋转15°</span><span><span class="key">Ctrl+Z/Y</span>撤销重做</span><span><span class="key">Ctrl+D</span>复制</span>
        <span>滚轮缩放，右键/空白拖动平移</span>
      </div>
    </div>
    <div id="center">
      <canvas id="cv"></canvas>
      <div id="energy"></div>
      <div id="warn"></div>
      <div id="hint"></div>
    </div>
    <div id="side">
      <h3>属性</h3>
      <div id="props"></div>
      <div id="readout"></div>
      <canvas id="plot" width="540" height="300"></canvas>
    </div>
  </div>
  <div id="status"><span id="stMsg">就绪</span><span id="stInfo"></span></div>
</div>
<div id="ghost"><canvas width="60" height="60"></canvas></div>
<script>
/* ===================== 物理引擎：自研 2D 刚体 / 约束求解器 =====================
 * 序列冲量 + 子步 (substep) + 热启动。单位：SI (m, kg, s, rad)。y 轴向下，角度顺时针为正。
 * 刚体：圆(c) / 矩形(b)。约束：铰链(pin, 可带电机)、滑动副(slide)、固定焊接(weld)。
 * 另有：弹簧/阻尼器（力元件）、碰撞(圆-圆、圆-矩形、矩形-矩形 SAT+裁剪)、库仑摩擦、恢复系数。
 */
const Phys = (function () {
  'use strict';
  const sqrt = Math.sqrt, abs = Math.abs, cos = Math.cos, sin = Math.sin, min = Math.min, max = Math.max;

  class Body {
    constructor(o) {
      this.id = o.id; this.x = o.x; this.y = o.y; this.a = o.a || 0;
      this.vx = 0; this.vy = 0; this.w = 0;
      this.static = !!o.static;
      this.m = this.static ? 0 : o.m; this.I = this.static ? 0 : o.I;
      this.im = this.static ? 0 : 1 / o.m; this.ii = this.static ? 0 : 1 / o.I;
      this.shape = o.shape || null;               // {t:'c',r} | {t:'b',hx,hy}
      this.mu = o.mu == null ? 0.5 : o.mu; this.e = o.e == null ? 0.2 : o.e;
      this.collide = o.collide !== false && !!this.shape;
      this.linDamp = o.linDamp || 0; this.angDamp = o.angDamp || 0;
      this.fx = 0; this.fy = 0; this.tq = 0;       // 每子步外力累加
      this.rfx = 0; this.rfy = 0;                  // 约束/接触反力累加(平均用)
      this.netx = 0; this.nety = 0; this.nsub = 0; // 净力统计
      this.rad = !this.shape ? 0 : this.shape.t === 'c' ? this.shape.r : sqrt(this.shape.hx ** 2 + this.shape.hy ** 2);
      this.comp = o.comp;
    }
    toWorld(l) { const c = cos(this.a), s = sin(this.a); return [this.x + c * l[0] - s * l[1], this.y + s * l[0] + c * l[1]]; }
    velAt(l) { const c = cos(this.a), s = sin(this.a); const rx = c * l[0] - s * l[1], ry = s * l[0] + c * l[1]; return [this.vx - this.w * ry, this.vy + this.w * rx]; }
  }

  // ---------- 约束 ----------
  class Joint {
    constructor(o) {
      this.type = o.type; this.A = o.A; this.B = o.B; this.la = o.la; this.lb = o.lb;
      this.refAngle = o.refAngle || 0;
      this.axisLocal = o.axisLocal || 0;  // slide: 轴在 A 局部系的角度
      this.limit = !!o.limit; this.lo = o.lo == null ? -1e9 : o.lo; this.hi = o.hi == null ? 1e9 : o.hi;
      this.motor = o.motor || null;       // {mode:'speed'|'torque', w (rad/s), maxT, T}
      this.beta = 0.1;
      this.Px = 0; this.Py = 0; this.L1 = 0; this.L2 = 0; this.Lm = 0; this.Llo = 0; this.Lhi = 0; this.La = 0;
      this.fx = 0; this.fy = 0; this.fsum = 0; this.fn = 0; this.id = o.id;
      this.dead = false;
    }
    pre(h) {
      const A = this.A, B = this.B;
      this.dead = (A.im === 0 && B.im === 0);
      const ca = cos(A.a), sa = sin(A.a), cb = cos(B.a), sb = sin(B.a);
      this.rax = ca * this.la[0] - sa * this.la[1]; this.ray = sa * this.la[0] + ca * this.la[1];
      this.rbx = cb * this.lb[0] - sb * this.lb[1]; this.rby = sb * this.lb[0] + cb * this.lb[1];
      const dx = (B.x + this.rbx) - (A.x + this.rax), dy = (B.y + this.rby) - (A.y + this.ray);
      this.dx = dx; this.dy = dy; this.h = h;
      const imA = A.im, imB = B.im, iiA = A.ii, iiB = B.ii;
      if (this.type === 'slide') {
        const ang = A.a + this.axisLocal;
        this.axx = cos(ang); this.axy = sin(ang); this.px = -this.axy; this.py = this.axx;
        this.a1 = (dx + this.rax) * this.py - (dy + this.ray) * this.px;
        this.a2 = this.rbx * this.py - this.rby * this.px;
        this.s1 = (dx + this.rax) * this.axy - (dy + this.ray) * this.axx;
        this.s2 = this.rbx * this.axy - this.rby * this.axx;
        let k11 = imA + imB + iiA * this.a1 * this.a1 + iiB * this.a2 * this.a2;
        let k12 = iiA * this.a1 + iiB * this.a2;
        let k22 = iiA + iiB; if (k22 === 0) k22 = 1;
        this.k11 = k11; this.k12 = k12; this.k22 = k22;
        const det = k11 * k22 - k12 * k12; this.idet = det !== 0 ? 1 / det : 0;
        this.kAx = imA + imB + iiA * this.s1 * this.s1 + iiB * this.s2 * this.s2;
        this.trans = dx * this.axx + dy * this.axy;
        this.c1 = dx * this.px + dy * this.py;
        this.c2 = B.a - A.a - this.refAngle;
        if (!this.limit) { this.Llo = 0; this.Lhi = 0; }
      } else {
        const k11 = imA + imB + iiA * this.ray * this.ray + iiB * this.rby * this.rby;
        const k12 = -iiA * this.rax * this.ray - iiB * this.rbx * this.rby;
        const k22 = imA + imB + iiA * this.rax * this.rax + iiB * this.rbx * this.rbx;
        const det = k11 * k22 - k12 * k12; this.idet = det !== 0 ? 1 / det : 0;
        this.k11 = k11; this.k12 = k12; this.k22 = k22;
        this.kw = iiA + iiB;
        this.cx = dx; this.cy = dy; this.c2 = B.a - A.a - this.refAngle;
      }
      if (this.dead) return;
      // 热启动
      if (this.type === 'slide') {
        const Px = this.px * this.L1 + this.axx * (this.Llo - this.Lhi), Py = this.py * this.L1 + this.axy * (this.Llo - this.Lhi);
        A.vx -= A.im * Px; A.vy -= A.im * Py; A.w -= A.ii * (this.L1 * this.a1 + this.L2 + (this.Llo - this.Lhi) * this.s1);
        B.vx += B.im * Px; B.vy += B.im * Py; B.w += B.ii * (this.L1 * this.a2 + this.L2 + (this.Llo - this.Lhi) * this.s2);
        this.fx = Px / h; this.fy = Py / h;
      } else {
        A.vx -= A.im * this.Px; A.vy -= A.im * this.Py; A.w -= A.ii * ((this.rax * this.Py - this.ray * this.Px) + this.L2 + this.Lm);
        B.vx += B.im * this.Px; B.vy += B.im * this.Py; B.w += B.ii * ((this.rbx * this.Py - this.rby * this.Px) + this.L2 + this.Lm);
      }
    }
    solve() {
      if (this.dead) return;
      const A = this.A, B = this.B, h = this.h, beta = this.beta;
      if (this.type === 'slide') {
        // 平移限位
        if (this.limit) {
          const cdot = this.axx * (B.vx - A.vx) + this.axy * (B.vy - A.vy) + this.s2 * B.w - this.s1 * A.w;
          let C = this.trans - this.lo; let bias = C > 0 ? C / h : beta / h * C;
          let imp = -(cdot + bias) / this.kAx; const nl = max(this.Llo + imp, 0); imp = nl - this.Llo; this.Llo = nl;
          this.applyAx(imp);
          C = this.hi - this.trans; bias = C > 0 ? C / h : beta / h * C;
          const cd2 = -(this.axx * (B.vx - A.vx) + this.axy * (B.vy - A.vy) + this.s2 * B.w - this.s1 * A.w);
          imp = -(cd2 + bias) / this.kAx; const nh = max(this.Lhi + imp, 0); imp = nh - this.Lhi; this.Lhi = nh;
          this.applyAx(-imp);
        }
        const cd1 = this.px * (B.vx - A.vx) + this.py * (B.vy - A.vy) + this.a2 * B.w - this.a1 * A.w;
        const cd2 = B.w - A.w;
        const b1 = beta / h * this.c1, b2 = beta / h * this.c2;
        const r1 = -(cd1 + b1), r2 = -(cd2 + b2);
        const i1 = this.idet * (this.k22 * r1 - this.k12 * r2), i2 = this.idet * (this.k11 * r2 - this.k12 * r1);
        this.L1 += i1; this.L2 += i2;
        const Px = this.px * i1, Py = this.py * i1;
        A.vx -= A.im * Px; A.vy -= A.im * Py; A.w -= A.ii * (i1 * this.a1 + i2);
        B.vx += B.im * Px; B.vy += B.im * Py; B.w += B.ii * (i1 * this.a2 + i2);
        this.fx = (this.px * this.L1 + this.axx * (this.Llo - this.Lhi)) / h; this.fy = (this.py * this.L1 + this.axy * (this.Llo - this.Lhi)) / h;
        return;
      }
      // 电机
      if (this.motor && this.motor.mode === 'speed' && this.kw > 0) {
        const cd = B.w - A.w - this.motor.w;
        let imp = -cd / this.kw; const maxI = this.motor.maxT * h;
        const nl = max(-maxI, min(maxI, this.Lm + imp)); imp = nl - this.Lm; this.Lm = nl;
        A.w -= A.ii * imp; B.w += B.ii * imp;
      }
      if (this.type === 'weld' && this.kw > 0) {
        const cd = B.w - A.w; const imp = -(cd + beta / h * this.c2) / this.kw;
        this.L2 += imp; A.w -= A.ii * imp; B.w += B.ii * imp;
      }
      // 点约束
      const dvx = B.vx - B.w * this.rby - A.vx + A.w * this.ray;
      const dvy = B.vy + B.w * this.rbx - A.vy - A.w * this.rax;
      const bx = beta / h * this.cx, by = beta / h * this.cy;
      const rx = -(dvx + bx), ry = -(dvy + by);
      const ix = this.idet * (this.k22 * rx - this.k12 * ry), iy = this.idet * (this.k11 * ry - this.k12 * rx);
      this.Px += ix; this.Py += iy;
      A.vx -= A.im * ix; A.vy -= A.im * iy; A.w -= A.ii * (this.rax * iy - this.ray * ix);
      B.vx += B.im * ix; B.vy += B.im * iy; B.w += B.ii * (this.rbx * iy - this.rby * ix);
      this.fx = this.Px / h; this.fy = this.Py / h;
    }
    applyAx(imp) {
      const A = this.A, B = this.B; const Px = this.axx * imp, Py = this.axy * imp;
      A.vx -= A.im * Px; A.vy -= A.im * Py; A.w -= A.ii * imp * this.s1;
      B.vx += B.im * Px; B.vy += B.im * Py; B.w += B.ii * imp * this.s2;
    }
  }


  // ---------- 传动约束 (通用速度级一行约束：Jv + b = 0，可单边/带扭矩上限/效率/自锁) ----------
  // J = [jvA(x,y), jwA, jvB(x,y), jwB]，由 upd(row,h) 每个子步按几何更新；用于齿轮/皮带/齿条/丝杠/凸轮/槽轮/棘轮/离合器等。
  class Row {
    constructor(o) {
      this.A = o.A; this.B = o.B; this.upd = o.upd; this.id = o.id; this.kind = o.kind || '';
      this.unilateral = !!o.unilateral;      // true: 冲量 ≥ 0 (接触/棘轮)
      this.eff = o.eff == null ? 1 : o.eff;  // 传递效率：输出侧冲量按 eff 折减
      this.lock = !!o.lock;                  // 自锁：被动侧不能反向驱动主动侧
      this.limitT = o.limitT || 0;           // 打滑扭矩上限(折算到 A 轴, N·m)，0=不限
      this.beta = o.beta == null ? 0.1 : o.beta; this.maxBias = o.maxBias || 25;
      this.L = 0; this.c0 = null; this.slip = false; this.on = true; this.abs = false;
      this.sA = 1; this.sB = 1; this.lim = Infinity;
      this.jvAx = 0; this.jvAy = 0; this.jwA = 0; this.jvBx = 0; this.jvBy = 0; this.jwB = 0; this.C = 0;
      this.tAS = 0; this.tBS = 0; this.fAS = 0; this.fBS = 0; this.nS = 0;
      this.tqA = 0; this.tqB = 0; this.fA = 0; this.fB = 0; this.data = {};
    }

    pre(h) {
